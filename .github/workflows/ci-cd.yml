name: SmartFit CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOCKER_REGISTRY: docker.io
  IMAGE_NAME: smartfit-api
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker images for tests
      run: docker compose -f docker-compose-tests.yml build
    
    - name: Run tests
      run: docker compose -f docker-compose-tests.yml run --rm tests pytest --cov=app --cov-report=xml
    
    - name: Copy coverage from container
      run: |
        # Создаём временный контейнер для копирования файла coverage.xml
        docker compose -f docker-compose-tests.yml run --rm --entrypoint "sh -c 'exit 0'" tests
        CONTAINER_ID=$(docker ps -aq --filter "name=smartfit-tests" | head -n 1)
        if [[ -n "$CONTAINER_ID" ]]; then
          docker cp $CONTAINER_ID:/app/coverage.xml ./coverage.xml
        fi
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
    
    - name: Stop and remove containers
      run: docker compose -f docker-compose-tests.yml down -v

    - name: Send notification on test failure
      if: failure()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}
        message: |
          ❌ *Тесты не прошли*
          
          *Project*: SmartFit
          *Commit*: ${{ github.sha }}
          *Branch*: ${{ github.ref_name }}
          *Triggered by*: ${{ github.actor }}
          
          [View details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

    - name: Send notification on build failure
      if: failure()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}
        message: |
          ❌ *Ошибка сборки Docker образа*
          
          *Project*: SmartFit
          *Commit*: ${{ github.sha }}
          *Branch*: ${{ github.ref_name }}
          *Triggered by*: ${{ github.actor }}
          
          [View details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Copy files to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "docker-compose.yml,.env.example"
        target: "${{ secrets.DEPLOY_PATH }}/staging"

    - name: Deploy to staging
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        envs: DOCKER_USERNAME,DEPLOY_PATH,IMAGE_NAME,GITHUB_SHA
        script: |
          set -euo pipefail
          cd ${{ secrets.DEPLOY_PATH }}/staging
          
          # Проверяем существование .env файла, если нет, создаем пустой
          if [ ! -f .env ]; then
            touch .env
          fi
          
          # Обновляем переменные окружения в .env
          grep -v "^DEBUG=" .env > .env.tmp || touch .env.tmp
          echo "DEBUG=True" >> .env.tmp
          grep -v "^DOCKER_USERNAME=" .env.tmp > .env.new
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env.new
          grep -v "^IMAGE_TAG=" .env.new > .env
          echo "IMAGE_TAG=${{ github.sha }}" >> .env
          grep -v "^IMAGE_NAME=" .env > .env.tmp
          echo "IMAGE_NAME=${{ env.IMAGE_NAME }}" >> .env.tmp
          mv .env.tmp .env
          
          # Добавляем другие переменные, если их нет
          grep -q "^FIREBASE_CREDENTIALS=" .env || echo "FIREBASE_CREDENTIALS=/app/firebase-credentials.json" >> .env
          grep -q "^POSTGRES_USER=" .env || echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          grep -q "^POSTGRES_PASSWORD=" .env || echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          grep -q "^POSTGRES_DB=" .env || echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
          grep -q "^TWILIO_ACCOUNT_SID=" .env || echo "TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}" >> .env
          grep -q "^TWILIO_AUTH_TOKEN=" .env || echo "TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}" >> .env
          grep -q "^TWILIO_PHONE_NUMBER=" .env || echo "TWILIO_PHONE_NUMBER=${{ secrets.TWILIO_PHONE_NUMBER }}" >> .env
          grep -q "^TELEGRAM_BOT_TOKEN=" .env || echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          grep -q "^TELEGRAM_ADMIN_BOT_TOKEN=" .env || echo "TELEGRAM_ADMIN_BOT_TOKEN=${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}" >> .env
          grep -q "^TELEGRAM_ADMIN_CHAT_ID=" .env || echo "TELEGRAM_ADMIN_CHAT_ID=${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}" >> .env
          grep -q "^TELEGRAM_DEBUG_BOT_TOKEN=" .env || echo "TELEGRAM_DEBUG_BOT_TOKEN=${{ secrets.TELEGRAM_DEBUG_BOT_TOKEN }}" >> .env
          grep -q "^TELEGRAM_DEBUG_CHAT_ID=" .env || echo "TELEGRAM_DEBUG_CHAT_ID=${{ secrets.TELEGRAM_DEBUG_CHAT_ID }}" >> .env
          grep -q "^OPENAI_API_KEY=" .env || echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          grep -q "^DEEPSEEK_API_KEY=" .env || echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> .env
          grep -q "^DEEPSEEK_MODEL=" .env || echo "DEEPSEEK_MODEL=${{ secrets.DEEPSEEK_MODEL }}" >> .env
          
          # Вход в Docker Hub с использованием переданных учетных данных
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          
          # Обновляем образы и перезапускаем контейнеры
          docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          
          # Определяем доступную команду docker compose
          if docker compose version &> /dev/null; then
            DOCKER_COMPOSE="docker compose"
          else
            DOCKER_COMPOSE="docker-compose"
          fi
          
          # Создаем директорию для логов, если её нет
          LOG_DIR="${{ secrets.DEPLOY_PATH }}/staging/logs"
          mkdir -p "$LOG_DIR"
          
          # Определяем имя контейнера (может отличаться из-за Docker Compose)
          CONTAINER_NAME=$(docker ps -q --filter name=smartfit-api)
          
          # Сохраняем логи перед обновлением
          if [ -n "$CONTAINER_NAME" ]; then
            LOG_DATE=$(date +"%d.%m.%y-%H.%M.%S")
            echo "Сохранение логов контейнера в файл $LOG_DIR/log-$LOG_DATE.log"
            docker logs $CONTAINER_NAME > "$LOG_DIR/log-$LOG_DATE.log" 2>&1
          else
            echo "Контейнер не найден, логи не сохранены"
            docker ps
            exit 1
          fi
          
          # Запускаем с явным указанием переменных из .env
          $DOCKER_COMPOSE -f docker-compose.yml up -d --force-recreate api
          
          # Очистка старых образов
          docker image prune -f
          
          # Проверка здоровья приложения
          sleep 10
          curl -f http://localhost:8000/health || exit 1
          
          # Выход из Docker Hub для безопасности
          docker logout

    - name: Send notification about deployment result
      if: always()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}
        message: |
          🚀 *Результат деплоя на Staging*
          
          *Project*: SmartFit
          *Environment*: Staging
          *Status*: ${{ job.status }}
          *Commit*: ${{ github.sha }}
          *Branch*: ${{ github.ref_name }}
          *Deployed by*: ${{ github.actor }}
          
          [View details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - uses: actions/checkout@v3

    - name: Copy files to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "docker-compose.yml,.env.example"
        target: "${{ secrets.DEPLOY_PATH }}/production"

    - name: Deploy to production
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd ${{ secrets.DEPLOY_PATH }}/production
          
          # Создаем .env файл из секретов
          echo "DEBUG=False" > .env
          echo "FIREBASE_CREDENTIALS=/app/firebase-credentials.json" >> .env
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
          echo "TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}" >> .env
          echo "TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}" >> .env
          echo "TWILIO_PHONE_NUMBER=${{ secrets.TWILIO_PHONE_NUMBER }}" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_ADMIN_BOT_TOKEN=${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_ADMIN_CHAT_ID=${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}" >> .env
          echo "TELEGRAM_DEBUG_BOT_TOKEN=${{ secrets.TELEGRAM_DEBUG_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_DEBUG_CHAT_ID=${{ secrets.TELEGRAM_DEBUG_CHAT_ID }}" >> .env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> .env
          echo "DEEPSEEK_MODEL=${{ secrets.DEEPSEEK_MODEL }}" >> .env
          
          # Обновляем образы и перезапускаем контейнеры
          docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          
          # Создаем директорию для логов, если её нет
          LOG_DIR="${{ secrets.DEPLOY_PATH }}/production/logs"
          mkdir -p "$LOG_DIR"
          
          # Определяем имя контейнера (может отличаться из-за Docker Compose)
          CONTAINER_NAME=$(docker ps -q --filter name=guatefit-api || docker ps -q --filter name=smartfit-api)
          
          # Сохраняем логи перед обновлением
          if [ -n "$CONTAINER_NAME" ]; then
            LOG_DATE=$(date +"%d.%m.%y-%H.%M.%S")
            echo "Сохранение логов контейнера в файл $LOG_DIR/log-$LOG_DATE.log"
            docker logs $CONTAINER_NAME > "$LOG_DIR/log-$LOG_DATE.log" 2>&1
          else
            echo "Контейнер не найден, логи не сохранены"
            exit 1
          fi
          
          docker compose -f docker-compose.yml up -d --force-recreate api
          
          # Очистка старых образов
          docker image prune -f
          
          # Проверка здоровья приложения
          sleep 10
          curl -f http://localhost:8000/health || exit 1
          
          # Выход из Docker Hub для безопасности
          docker logout

    - name: Send notification about deployment result
      if: always()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}
        message: |
          🚀 *Результат деплоя на Production*
          
          *Project*: SmartFit
          *Environment*: Production
          *Status*: ${{ job.status }}
          *Commit*: ${{ github.sha }}
          *Branch*: ${{ github.ref_name }}
          *Deployed by*: ${{ github.actor }}
          
          [View details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

    - name: Send notification on deploy failure
      if: failure()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}
        message: |
          ❌ *Критическая ошибка деплоя в Production*
          
          *Project*: SmartFit
          *Commit*: ${{ github.sha }}
          *Branch*: ${{ github.ref_name }}
          
          Требуется срочное вмешательство! Приложение может быть недоступно.
          
          [View details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})