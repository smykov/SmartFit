version: '3.8'

services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: guatefit-tests
    volumes:
      - .:/app
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    environment:
      - PYTHONPATH=/app
      - DEBUG=True
      - TESTING=True
      - FIREBASE_CREDENTIALS=/app/firebase-credentials.json
      - USE_MOCK_SERVICES=True
      # Используем моки вместо реальных сервисов
      - LLM_PROVIDER=mock
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=guatefit
      - POSTGRES_PASSWORD=guatefit_password
      - POSTGRES_DB=guatefit_test
    command: pytest -xvs
    networks:
      - guatefit-network
    depends_on:
      - postgres

  # Используем тот же сервис postgres из основного docker-compose
  postgres:
    image: postgres:14-alpine
    container_name: guatefit-postgres-test
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guatefit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guatefit_password}
      POSTGRES_DB: ${POSTGRES_DB:-guatefit_test}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # Другой порт чтобы не конфликтовать с основной БД
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guatefit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - guatefit-network

volumes:
  postgres-test-data:

networks:
  guatefit-network:
    driver: bridge