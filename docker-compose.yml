version: '3.8'

services:
  api:
    image: ${DOCKER_USERNAME:-smykov}/smartfit-api:${IMAGE_TAG:-latest}
    container_name: smartfit-api
    restart: always
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - smartfit-network

  postgres:
    image: postgres:14-alpine
    container_name: smartfit-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - smartfit-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  smartfit-network:
    driver: bridge